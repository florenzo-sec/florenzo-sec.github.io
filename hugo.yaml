baseURL: "https://florenzo-sec.github.io/"
title: "florenzo-sec"
theme: PaperMod
locale: en
defaultContentLanguage: en
hasCJKLanguage: false
pagination:
  pagerSize: 10
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
pygmentsUseClasses: true

minify:
  disableXML: true
  minifyOutput: true

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: "florenzo-sec"
  description: "Study notes on cybersecurity, networking and Hack The Box: how things get attacked and, above all, how to defend them."
  author: "florenzo-sec"
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  homeInfoParams:
    Title: "Hi, I'm florenzo-sec"
    Content: >
      I study cybersecurity and networking (CCNA, Security+). This blog collects my write-ups
      of the Hack The Box machines I complete, each with a section on how the attack
      can be prevented and detected.

  socialIcons:
    - name: github
      url: "https://github.com/florenzo-sec"
    - name: rss
      url: "index.xml"

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: posts
      name: Write-ups
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
    - identifier: search
      name: Search
      url: /search/
      weight: 30
    - identifier: about
      name: About
      url: /about/
      weight: 40
